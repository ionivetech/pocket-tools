<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2563eb" />
		<title>PocketTools · Offline</title>
		<style>
			:root {
				color-scheme: light;
				font-family: ui-sans-serif, system-ui, sans-serif;
				background: #f6f8fc;
				color: #172033;
			}
			body {
				display: grid;
				min-height: 100dvh;
				margin: 0;
				place-items: center;
				padding: 1.5rem;
			}
			main {
				max-width: 30rem;
				width: min(100%, 30rem);
			}
			.card {
				padding: clamp(1.5rem, 5vw, 3rem);
				border: 1px solid #dbe3f0;
				border-radius: 1.25rem;
				background: #fff;
				box-shadow: 0 20px 50px rgb(23 32 51 / 8%);
			}
			.mark {
				display: grid;
				width: 2.75rem;
				height: 2.75rem;
				place-items: center;
				border-radius: 0.8rem;
				background: #2563eb;
				color: #f8fbff;
				font-weight: 800;
			}
			h1 {
				margin: 1.5rem 0 0.75rem;
				font-size: clamp(2.5rem, 8vw, 4.5rem);
				letter-spacing: -0.06em;
				line-height: 0.98;
			}
			p {
				color: #667085;
				line-height: 1.6;
			}
			a {
				display: inline-flex;
				min-height: 2.75rem;
				align-items: center;
				margin-top: 1rem;
				padding: 0.7rem 1rem;
				border-radius: 0.7rem;
				background: #2563eb;
				color: #f8fbff;
				font-weight: 800;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<section class="card" aria-labelledby="offline-title">
				<div class="mark" aria-hidden="true">P</div>
				<h1 id="offline-title">You are offline.</h1>
				<p>
					The PocketTools shell is still available. Reconnect to load fresh data, or return to the
					cached collection.
				</p>
				<a href="/tools">Browse cached tools</a>
			</section>
		</main>
	</body>
</html>
